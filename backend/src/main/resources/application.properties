spring.application.name=finance-balance
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.error.include-message=never

# Banco (variaveis de ambiente; defaults apontam para o docker-compose local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/financebalance}
spring.datasource.username=${DB_USER:financebalance}
spring.datasource.password=${DB_PASSWORD:financebalance}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Paginacao
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT e CORS (sem default para o segredo: defina JWT_SECRET ou use o profile dev)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger: desligue em producao com SWAGGER_ENABLED=false se preferir
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
